<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 4 - Table & Form</title>
    <link rel="stylesheet" href="task4-styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 1 (Home)</a>
        <a href="task2.html">Task 2 (Layout)</a>
        <a href="exercise1/index.html">Task 3 (Tribute)</a>
        <a href="task4.html">Task 4 (Table & Form)</a>
    </nav>

    <h1 id="table-heading">Student Grades</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alikhan</td>
                <td>Frontend</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Dinara</td>
                <td>Database</td>
                <td>B+</td>
            </tr>
            <tr class="highlight-row">
                <td>Timur</td>
                <td>Math</td>
                <td>A+</td>
            </tr>
            <tr>
                <td colspan="2">Average Grade of the Group</td>
                <td>A-</td>
            </tr>
        </tbody>
    </table>

    <h1 id="form-heading">Feedback Form</h1>

    <div class="form-container">
        <form action="#" method="POST">
            
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="role">Role:</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="other">Other</option>
            </select>

            <label>Do you like this course?</label>
            <div class="radio-group">
                <input type="radio" id="yes" name="like_course" value="yes">
                <label for="yes">Yes</label>
                <input type="radio" id="no" name="like_course" value="no">
                <label for="no">No</label>
            </div>

            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>

            <button type="submit" id="submit-btn">Submit</button>

        </form>
    </div>

</body>
</html>
